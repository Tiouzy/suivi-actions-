name: Suivi PEA hebdo

on:
  schedule:
    - cron: "0 17 * * 0"   # dimanche 17:00 UTC = 19h (été) / 18h (hiver) à Paris
  workflow_dispatch:         # lancement manuel depuis l'onglet Actions

permissions:
  contents: write            # pour mémoriser les derniers cours (state/)

jobs:
  suivi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python suivi.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Mémoriser les cours
        run: |
          git config user.name "suivi-pea-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "Cours de la semaine" && git push)
